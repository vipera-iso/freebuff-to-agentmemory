[project]
name = "agentmemory-mcp-bridge"
version = "0.1.0"
description = "Streamable HTTP MCP bridge that wraps agentmemory's @agentmemory/mcp stdio server for Freebuff."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
agentmemory-mcp-bridge = "agentmemory_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentmemory_bridge"]
