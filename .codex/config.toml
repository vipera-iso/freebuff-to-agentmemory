# Codex CLI — định tuyến qua shim cục bộ (http://localhost:8081) -> Bifrost gateway (http://localhost:8080)
# Docs: https://docs.getbifrost.ai/cli-agents/codex-cli
#
# Shim: ~/tools/codex-ns-shim/shim.py — làm phẳng tool type:"namespace" của Codex
# (openai/codex#23186) thành function tools trước khi chuyển tiếp lên Bifrost.
# Khởi động shim trước khi chạy codex:
#   SHIM_UPSTREAM=http://127.0.0.1:8080/openai/v1 python3 ~/tools/codex-ns-shim/shim.py
# (Tuỳ chọn: SHIM_VERBOSE=1 để log request; HEALTH check: curl http://127.0.0.1:8081/)

# ===== Model & Provider =====
model = "agnes/agnes-2.5-flash"
model_provider = "bifrost"

# ===== Tương thích Agnes AI (không hỗ trợ tool type `namespace`/`web_search`) =====
web_search = "disabled"

[features]
multi_agent = false

[model_providers.bifrost]
name = "Bifrost"
# Qua shim (8081) thay vì thẳng Bifrost (8080) — shim làm phẳng namespace tools.
base_url = "http://localhost:8081/openai/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
supports_websockets = false

# ===== Combo 1: Giảm token, không giảm độ thông minh =====
# Suy luận nông hơn cho tác vụ đơn giản (tiết kiệm 40-50% reasoning token).
# Nâng lên "medium"/"high" khi cần xử lý tác vụ phức tạp: codex -c model_reasoning_effort=\"high\"
model_reasoning_effort = "low"

# Tắt tóm tắt quá trình suy luận (bỏ qua auto|concise|detailed nếu muốn xem lại)
model_reasoning_summary = "none"

# Nén context ở ngưỡng ~60-70% context window thay vì để phình to
model_auto_compact_token_limit = 120000

[mcp_servers.trl-retrieve]
command = "/home/user/tools/trl-venv/bin/python"
args = ["-m", "plugin.mcp_server"]

[mcp_servers.trl-retrieve.env]
PYTHONPATH = "/home/user/tools/trl-token-reduction"
TRL_REPO = "."

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[marketplaces.superpowers-dev]
source_type = "git"
source = "https://github.com/obra/superpowers.git"

[plugins."superpowers@superpowers-dev"]
enabled = true

[projects."/home/user"]
trust_level = "trusted"

